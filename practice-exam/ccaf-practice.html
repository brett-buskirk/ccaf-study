it. What is the right recovery?","o":["Resubmit only those 40, identified by custom_id, after chunking them","Resubmit all 2,000 with a larger max_tokens","Discard the 40 and report 98% coverage","Move the entire workload to the synchronous API"],"e":"Failures are identified by custom_id and resubmitted alone, with the modification each needs, such as chunking oversized documents."},{"id":"4.5-05","d":4,"t":"4.5","q":"Documents must be processed within 28 hours of arrival. A batch can take up to 24 hours. What is the longest interval between batch submissions that guarantees this?","o":["4 hours","8 hours","24 hours","28 hours"],"e":"Worst case is a full interval of waiting plus 24 hours of processing. Interval plus 24 must not exceed 28, so the interval is at most 4 hours."},{"id":"4.6-01","d":4,"t":"4.6","q":"After generating a module, Claude is told \"Now review your work using extended thinking.\" It finds little. An independent reviewer finds three bugs. What best explains the gap?","o":["The generating session keeps its original reasoning","Extended thinking is unavailable for code review tasks","The independent reviewer was given a larger context window and could therefore see more of the module at once","The module was too short for a self-review to work"],"e":"Self-review is limited because the model retains the reasoning that produced the code. A second instance without that context is more effective."},{"id":"4.6-02","d":4,"t":"4.6","q":"A single-pass review of a 14-file pull request contradicts itself: it flags a pattern in one file and approves the same pattern in another. What is the best restructuring?","o":["Per-file passes, plus a separate cross-file pass","One pass with a higher-tier model and a larger context window, so that all 14 files fit comfortably","One pass, repeated three times, keeping only repeated findings","One pass per pull request, but with files sorted by size"],"e":"Splitting large reviews into focused per-file passes and a cross-file pass addresses attention dilution and contradictory findings."},{"id":"4.6-03","d":4,"t":"4.6","q":"An engineer proposes running a full-PR review three times and keeping only the findings that appear in at least two runs. What is the weakness of this idea?","o":["It discards real issues that are only caught some of the time, without fixing the attention problem","It triples the number of false positives reported","It requires the batch API, which is too slow for reviews","It prevents findings from being posted as inline comments"],"e":"Consensus filtering suppresses intermittent but real catches. The underlying problem, too many files in one pass, remains."},{"id":"4.6-04","d":4,"t":"4.6","q":"You want to route review findings so that uncertain ones get a human look and solid ones post automatically. What can a verification pass add to support this?","o":["A self-reported confidence value alongside each finding, used for calibrated routing","A second, independently worded copy of each finding, so that reviewers can compare the two","A longer description that restates each finding","A random sample of findings to delete"],"e":"Verification passes can have the model report confidence with each finding, which enables calibrated routing to review."},{"id":"4.6-05","d":4,"t":"4.6","q":"What is the simplest effective setup for catching subtle bugs in AI-generated code before a human sees it?","o":["Generate in one instance and review in a second, independent instance","Generate and review in one instance, using a longer and more detailed prompt","Generate twice and keep whichever version is shorter","Generate once and ask the same instance if it is sure"],"e":"A multi-instance design, one to generate and an independent one to review, avoids the blind spots of self-review."},{"id":"5.1-01","d":5,"t":"5.1","q":"Deep into a support chat, an agent that earlier confirmed \"order 88213, delivered 4 March, refund of $112.40 approved\" now says \"your refund for a recent order is on its way.\" Summarization ran twice in between. What prevents this loss of detail?","o":["Keep the facts in a block included in every prompt","Summarize the conversation after every single turn","Ask the customer to repeat the order details periodically","Turn off summarization entirely and let the oldest turns of the conversation be truncated when space runs out"],"e":"Progressive summarization turns exact numbers and dates into vague phrases. A separate case-facts block keeps them intact."},{"id":"5.1-02","d":5,"t":"5.1","q":"A coordinator feeds findings from twelve subagents into one synthesis prompt. The report reflects the first few and the last few well but leaves out most of the middle ones. What mitigates this?","o":["Put a summary of key findings at the start and organize the details under explicit section headers","Shuffle the order of the findings on each run","Send the findings twice in the same prompt","Shorten the first and last findings so the middle stands out"],"e":"Models attend best to the start and end of long inputs. A leading summary and clear section headers counter the lost-in-the-middle effect."},{"id":"5.1-03","d":5,"t":"5.1","q":"Each order lookup returns more than 40 fields, of which the agent uses five. After several lookups the context is mostly order data and the agent's answers get worse. What is the best fix?","o":["Trim each tool result to the relevant fields before it enters the conversation","Tell the agent in its system prompt to ignore any fields it does not need for the task","Call the lookup tool less often","Move the lookups to the end of the conversation"],"e":"Tool results accumulate and consume tokens out of proportion to their relevance. Trimming at the source keeps only what matters."},{"id":"5.1-04","d":5,"t":"5.1","q":"A search subagent returns its findings as three pages of reasoning. The downstream analysis agent has a limited context budget and misses key facts. How should upstream agents return results?","o":["As structured data with key facts, citations, and relevance scores","As the same reasoning, but compressed into a single very long paragraph","As a single sentence with no supporting detail","As raw tool output with nothing removed"],"e":"When downstream agents have limited context, upstream agents should return structured key facts instead of verbose content and reasoning chains."},{"id":"5.2-01","d":5,"t":"5.2","q":"A customer writes: \"This is the third time my package is late, I'm so tired of this.\" They haven't asked for a human. The agent can issue the standard delay credit. What should it do?","o":["Acknowledge the frustration and offer the credit, escalating if they then ask for a human","Escalate at once, because the customer is clearly upset","Ask the customer to rate their frustration from 1 to 10","Close the conversation and send a satisfaction survey"],"e":"Frustration alone isn't an escalation trigger when the issue is within the agent's capability. An explicit request for a human would be."},{"id":"5.2-02","d":5,"t":"5.2","q":"A customer asks the agent to match a competitor's lower price. The policy covers price adjustments for the company's own site and says nothing about competitors. What should the agent do?","o":["Escalate, because policy doesn't address the request","Approve the match, since price adjustments are allowed in general","Refuse, since competitor matching isn't listed","Offer half the difference as a reasonable compromise"],"e":"When policy is silent or ambiguous about a request, that's a policy gap and an escalation trigger. The agent shouldn't invent policy in either direction."},{"id":"5.2-03","d":5,"t":"5.2","q":"A team proposes routing chats to humans whenever sentiment analysis detects strong negative emotion. What is the main flaw?","o":["Sentiment doesn't indicate how complex a case is","Sentiment analysis is too slow to run during a chat","Customers dislike having their sentiment analyzed","Negative sentiment always means the agent has already made an error that a human now needs to correct"],"e":"Sentiment is an unreliable proxy for case complexity. Escalation should rest on explicit criteria such as a request for a human, a policy gap, or no progress."},{"id":"5.2-04","d":5,"t":"5.2","q":"An engineer suggests having the agent rate its own confidence from 1 to 10 and escalate anything under 6. Why is this a weak escalation mechanism?","o":["Self-reported confidence is poorly calibrated","A ten-point scale is too coarse for this purpose and should be replaced with a hundred-point scale","Confidence ratings double the cost of every response","Customers can see the rating and find it off-putting"],"e":"Self-reported confidence is an unreliable indicator. The agent tends to be confidently wrong on exactly the hard cases."},{"id":"5.3-01","d":5,"t":"5.3","q":"A search subagent times out and returns only \"status: search unavailable\" to the coordinator. Why is this a poor design?","o":["It hides what failed and what was tried","It uses too many tokens to report a simple failure","It should have ended the entire workflow instead","It should have returned an empty list marked as successful so the rest of the pipeline could continue"],"e":"Generic statuses strip out the context needed for recovery. Structured error context lets the coordinator retry differently, route around, or proceed and annotate."},{"id":"5.3-02","d":5,"t":"5.3","q":"A research pipeline runs five subagents. One fails on an unreachable source, and the whole run is aborted, discarding the other four results. What is the better behavior?","o":["Continue with the partial results and note the gap in the final output","Retry the entire pipeline from the start until all five subagents succeed","Return nothing until all five succeed","Silently drop the failed topic from the report"],"e":"Ending the whole workflow on one failure wastes good work. The coordinator should proceed with partial results and annotate what is missing."},{"id":"5.3-03","d":5,"t":"5.3","q":"A subagent reports \"no sources found on battery recycling.\" What must its report make clear for the coordinator to act correctly?","o":["Whether the search ran and matched nothing, or failed to run","How long the search took","Which model the subagent used","How many tokens the subagent consumed"],"e":"An access failure may deserve a retry; a valid empty result is a finding. The coordinator needs to know which one it is."},{"id":"5.3-04","d":5,"t":"5.3","q":"Two of six sources were unreachable during a research run. How should the final synthesis handle this?","o":["Mark which findings are well supported and where sources were missing","Present all of the findings with equal confidence so that the report reads cleanly and does not alarm the reader","Leave out any topic that had an unavailable source without mentioning it","Fill the gaps with the model's general knowledge, unlabeled"],"e":"Coverage annotations tell the reader what the report rests on and where it is thin. An unannotated incomplete report looks complete."},{"id":"5.4-01","d":5,"t":"5.4","q":"Two hours into exploring a large codebase, Claude stops naming the specific classes it found earlier and starts describing \"typical patterns in systems like this.\" What technique counters this?","o":["Have the agent write key findings to a scratchpad file and refer back to it","Ask the agent to try harder to remember the specific classes it has already found","Restart the exploration from the beginning","Increase the temperature for more varied output"],"e":"Context degrades over long sessions. Scratchpad files persist key findings outside the conversation so they can be re-read."},{"id":"5.4-02","d":5,"t":"5.4","q":"A main agent investigating a bug reads through dozens of files to answer side questions such as \"where are the test fixtures?\" Its context fills before the investigation ends. What is the better structure?","o":["Spawn subagents for those specific questions while the main agent keeps the high-level thread","Have the main agent read the files faster","Remove the side questions from the task","Use a single agent with a longer system prompt"],"e":"Delegating verbose exploration to subagents isolates their output. The main agent receives answers and keeps its context for coordination."},{"id":"5.4-03","d":5,"t":"5.4","q":"A long multi-agent codebase analysis crashes after four of six agents finish. On restart, all six run again. What design avoids repeating finished work?","o":["Agents export state to a manifest that is reloaded","Each agent keeps its state in memory only","The coordinator re-asks each agent, after the restart, what it remembers finding before the crash happened","The crash handler deletes all partial state for safety"],"e":"Structured state persistence, with agents exporting to known locations and the coordinator loading a manifest, enables crash recovery."},{"id":"5.4-04","d":5,"t":"5.4","q":"During a long exploration session, the context is filling with verbose file listings and search output, though the work is still on track. Which command reduces context usage?","o":["/compact","/memory","/mcp","/resume"],"e":"/compact condenses the conversation to free up context during extended sessions. /memory shows loaded instruction files."},{"id":"5.5-01","d":5,"t":"5.5","q":"A document extraction system reports 96% accuracy overall. Before reducing human review, what should the team verify?","o":["Accuracy for each document type and each field","That 96% is higher than the previous quarter's figure","That the model reports high confidence on most documents, including the unusual ones in the sample","That reviewers agree the system seems reliable"],"e":"Aggregate accuracy can mask poor performance on specific document types or fields. Segment-level validation comes first."},{"id":"5.5-02","d":5,"t":"5.5","q":"After automating high-confidence extractions, how does a team keep measuring the true error rate and catch new error patterns?","o":["Stratified random sampling of the high-confidence extractions for human review","Reviewing only the extractions that the model itself flags as low confidence each week","Comparing this month's volume with last month's","Asking the model to estimate its own error rate"],"e":"Sampling the auto-approved output, stratified across document types, measures real error rates and detects novel patterns."},{"id":"5.5-03","d":5,"t":"5.5","q":"A team wants to use the model's field-level confidence scores to decide which fields a human checks. What must be done before trusting the scores?","o":["Calibrate the review thresholds against a labeled validation set","Round every score to the nearest ten percent","Average the scores across all fields in a document","Ask the model whether its scores are accurate"],"e":"Confidence scores are only useful for routing once thresholds are calibrated against data with known correct answers."},{"id":"5.5-04","d":5,"t":"5.5","q":"Reviewer capacity covers about 10% of extracted documents. Which documents should be routed to them?","o":["Those with low model confidence or ambiguous or contradictory source content","The first 10% of documents that arrive each day, before the review queue builds up","The longest documents by page count","A fixed list of the largest vendors"],"e":"Limited reviewer time should go where errors are most likely: low-confidence extractions and sources that are ambiguous or contradictory."},{"id":"5.6-01","d":5,"t":"5.6","q":"Two reputable sources give different figures for the same statistic in the same year. How should a research synthesis handle this?","o":["Report both figures with their sources and note the disagreement","Report the higher figure, since it is the more conservative of the two","Average the two figures and report the result","Report whichever source was found first"],"e":"Conflicting values from credible sources are annotated with attribution, not arbitrarily resolved. The reader sees the disagreement."},{"id":"5.6-02","d":5,"t":"5.6","q":"A synthesis flags two figures as contradictory. They turn out to be from the same annual survey, three years apart. What requirement would have prevented the misreading?","o":["Subagents must include publication or collection dates in their structured outputs","Subagents must return fewer findings per source","The synthesis agent must be given web search","Sources older than one year must be discarded"],"e":"Dates in structured outputs let the synthesis distinguish a change over time from a real contradiction."},{"id":"5.6-03","d":5,"t":"5.6","q":"A research report covers quarterly revenue figures, a recent regulatory news story, and a list of technical findings. How should the synthesis present them?","o":["Each in the form that suits it: a table for figures, prose for the story, a list for the findings","All as paragraphs of prose, so the report gives a uniform reading experience from the first page to the last","All as tables, since tables are the most precise","All as bullet points, for brevity"],"e":"Different content types should be rendered appropriately instead of being forced into one uniform format."}];
const TASK_IDS = Object.keys(TASKS);
const byId = Object.fromEntries(BANK.map((q) => [q.id, q]));
const KEY = "ccaf-practice-v1";
const $ = (id) => document.getElementById(id);
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v; else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v === true) n.setAttribute(k, ""); else if (v !== false && v != null) n.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) n.append(kid.nodeType ? kid : document.createTextNode(kid));
  return n;
};

// ---------- saved state ----------
let memoryOnly = false;
function blank() { return { v: 1, log: [], focus: true, filter: null }; }
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return blank();
    const s = JSON.parse(raw);
    return { ...blank(), ...s, log: Array.isArray(s.log) ? s.log.filter((r) => byId[r.id]) : [] };
  } catch { memoryOnly = true; return blank(); }
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch { memoryOnly = true; } }
let state = load();

// ---------- statistics ----------
// "Current" accuracy uses only the latest attempt at each question, so the map improves when you fix a miss.
// A correct answer marked as a guess counts as not yet known.
function stats() {
  const latest = {};
  for (const r of state.log) latest[r.id] = r;
  const mk = () => ({ total: 0, seen: 0, known: 0, attempts: 0 });
  const task = Object.fromEntries(TASK_IDS.map((t) => [t, mk()]));
  const dom = DOMAINS.map(() => mk());
  for (const q of BANK) {
    for (const g of [task[q.t], dom[q.d]]) {
      g.total++;
      if (latest[q.id]) { g.seen++; if (latest[q.id].ok && !latest[q.id].guess) g.known++; }
    }
  }
  for (const r of state.log) { task[byId[r.id].t].attempts++; dom[byId[r.id].d].attempts++; }
  return { latest, task, dom };
}
const pct = (g) => (g.seen ? Math.round((100 * g.known) / g.seen) : null);
const band = (p) => (p == null ? "" : p >= 80 ? "strong" : p >= 60 ? "mid" : "weak");
function weighted(s) {
  let num = 0, den = 0;
  for (let d = 1; d <= 5; d++) if (s.dom[d].seen) { num += DOMAINS[d].weight * pct(s.dom[d]); den += DOMAINS[d].weight; }
  return den ? Math.round(num / den) : null;
}
function today() {
  const start = new Date(); start.setHours(0, 0, 0, 0);
  const rows = state.log.filter((r) => r.at >= start.getTime());
  return { n: rows.length, ok: rows.filter((r) => r.ok).length };
}

// ---------- choosing the next question ----------
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
function pool() {
  const f = state.filter;
  if (!f) return BANK;
  return BANK.filter((q) => (f.task ? q.t === f.task : q.d === f.domain));
}
function nextQuestion(avoidId) {
  const s = stats();
  const recent = new Set(state.log.slice(-12).map((r) => r.id));
  if (avoidId) recent.add(avoidId);
  let candidates = pool().filter((q) => !recent.has(q.id));
  if (!candidates.length) candidates = pool().filter((q) => q.id !== avoidId);
  if (!candidates.length) candidates = pool();

  if (state.focus) {
    // Weight each task by how weak it is and how much of it is still unseen, then draw a task.
    const tasks = [...new Set(candidates.map((q) => q.t))];
    const weights = tasks.map((t) => {
      const g = s.task[t];
      const miss = 1 - (g.known + 1) / (g.seen + 2);
      const unseen = (g.total - g.seen) / g.total;
      return 0.1 + miss + 0.8 * unseen;
    });
    let roll = Math.random() * weights.reduce((a, b) => a + b, 0);
    let chosen = tasks[tasks.length - 1];
    for (let i = 0; i < tasks.length; i++) { roll -= weights[i]; if (roll <= 0) { chosen = tasks[i]; break; } }
    candidates = candidates.filter((q) => q.t === chosen);
  }
  const unseen = candidates.filter((q) => !s.latest[q.id]);
  if (unseen.length) return pick(unseen);
  const missed = candidates.filter((q) => !s.latest[q.id].ok || s.latest[q.id].guess);
  const from = missed.length ? missed : candidates;
  return from.slice().sort((a, b) => s.latest[a.id].at - s.latest[b.id].at)[0];
}

// ---------- header: coverage map and ticker ----------
function renderHeader() {
  const s = stats();
  const map = $("map");
  map.replaceChildren();
  for (let d = 1; d <= 5; d++) {
    const ids = TASK_IDS.filter((t) => t[0] === String(d));
    const grp = el("span", { class: "grp", style: `--n:${ids.length}` }, el("span", { class: "lab" }, DOMAINS[d].tag || DOMAINS[d].short));
    for (const t of ids) {
      const p = pct(s.task[t]);
      grp.append(el("span", { class: `cell ${band(p)}${current && current.q.t === t ? " now" : ""}`, title: `${t} ${TASKS[t]}: ${p == null ? "not started" : p + "%"}` }));
    }
    map.append(grp);
  }
  const seen = Object.keys(s.latest).length;
  const w = weighted(s);
  const t = today();
  const ranked = [1, 2, 3, 4, 5].filter((d) => s.dom[d].seen >= 3).sort((a, b) => pct(s.dom[a]) - pct(s.dom[b]));
  const tick = $("ticker");
  tick.replaceChildren();
  if (!seen) { tick.append("Each square is one exam task statement. They fill in as you answer."); return; }
  tick.append(el("b", {}, `${seen} of ${BANK.length}`), " questions seen");
  if (w != null) tick.append(", ", el("b", {}, `${w}%`), " exam-weighted");
  if (ranked.length >= 2 && pct(s.dom[ranked[0]]) !== pct(s.dom[ranked.at(-1)])) {
    tick.append(". Weakest: ", el("b", {}, DOMAINS[ranked[0]].short), ". Strongest: ", el("b", {}, DOMAINS[ranked.at(-1)].short));
  }
  tick.append(`. Today: ${t.ok} of ${t.n}.`);
}

// ---------- practice view ----------
let current = null; // { q, order, picked }
function startQuestion() {
  const q = nextQuestion(current && current.q.id);
  const order = [0, 1, 2, 3].sort(() => Math.random() - 0.5);
  current = { q, order, picked: null, entry: null };
  renderPractice(); renderHeader();
}
function answer(i) {
  if (current.picked != null) return;
  current.picked = i;
  current.entry = { id: current.q.id, ok: current.order[i] === 0, at: Date.now() };
  state.log.push(current.entry);
  save(); renderPractice(); renderHeader();
  const nx = $("next"); if (nx) nx.focus();
}
function filterLabel() {
  const f = state.filter;
  return f.task ? `Only ${f.task} ${TASKS[f.task]}` : `Only domain ${f.domain}: ${DOMAINS[f.domain].name}`;
}
function renderPractice() {
  const root = $("practice");
  root.replaceChildren();
  if (state.filter) {
    root.append(el("div", { class: "filter" }, filterLabel(), el("button", { onclick: () => { state.filter = null; save(); startQuestion(); } }, "Show all")));
  }
  const { q, order, picked } = current;
  root.append(el("p", { class: "where" }, `Domain ${q.d}, ${DOMAINS[q.d].name}. Task ${q.t}, ${TASKS[q.t]}.`));
  root.append(el("p", { class: "q", id: "qtext" }, q.q));
  const list = el("ol", { class: "opts", "aria-labelledby": "qtext" });
  order.forEach((src, i) => {
    const done = picked != null;
    const isRight = src === 0;
    const cls = !done ? "" : isRight ? " right" : i === picked ? " wrong" : "";
    const tag = !done ? null : isRight ? (i === picked ? "Correct. Your answer." : "Correct answer") : i === picked ? "Your answer" : null;
    list.append(el("li", {}, el("button", { class: "opt" + cls, disabled: done, onclick: () => answer(i) },
      el("span", { class: "k" }, "ABCD"[i]), el("span", {}, q.o[src], tag && el("span", { class: "tag" }, tag)))));
  });
  root.append(list);
  if (picked != null) {
    const wasRight = current.entry.ok;
    const guess = el("label", { class: "sw" }, el("input", { type: "checkbox", onchange: (e) => { current.entry.guess = e.target.checked; save(); renderHeader(); } }), "That was a guess. Count it as not yet known.");
    root.append(el("div", { class: "after" }, el("p", {}, q.e), wasRight ? el("p", {}, guess) : null,
      el("div", { class: "row" }, el("button", { class: "btn", id: "next", onclick: startQuestion }, "Next question"))));
  } else {
    root.append(el("p", { class: "note", style: "margin-top:1.25rem" }, el("label", { class: "sw" },
      el("input", { type: "checkbox", checked: state.focus, onchange: (e) => { state.focus = e.target.checked; save(); } }),
      "Favor my weak and unseen areas")));
  }
  if (memoryOnly) root.append(el("p", { class: "note" }, "This browser is blocking saved data, so progress will last only until you close the page. Export it from Your data to keep it."));
}

// ---------- progress view ----------
function practiceOnly(filter) { state.filter = filter; save(); show("practice"); startQuestion(); }
function barRow(cls, name, g, onclick) {
  const p = pct(g);
  return el("button", { class: "bar " + cls, onclick },
    el("span", { class: "name" }, name), el("span", { class: "pct" }, p == null ? "" : p + "%"),
    el("span", { class: "track" }, el("span", { class: "fill " + band(p), style: `width:${p ?? 0}%` })),
    el("span", { class: "sub" }, g.seen ? `${g.known} known of ${g.seen} seen. ${g.total - g.seen} of ${g.total} still unseen.` : `Not started. ${g.total} questions.`));
}
function renderProgress() {
  const s = stats();
  const root = $("progress");
  root.replaceChildren();
  const seen = Object.keys(s.latest).length;
  if (!seen) { root.append(el("p", { class: "lead" }, "Nothing to show yet. Answer a few questions and this page will chart where you are strong and where you are not.")); return; }
  const w = weighted(s);
  const started = TASK_IDS.filter((t) => s.task[t].seen >= 2).sort((a, b) => pct(s.task[a]) - pct(s.task[b]) || s.task[b].seen - s.task[a].seen);
  let lead = `You have seen ${seen} of ${BANK.length} questions and currently know ${w}% of them, weighted the way the exam weights its domains.`;
  if (started.length >= 3) lead += ` Your weakest task statement is ${started[0]} ${TASKS[started[0]]}, and your strongest is ${started.at(-1)} ${TASKS[started.at(-1)]}.`;
  root.append(el("p", { class: "lead" }, lead));

  if (started.length >= 3 && pct(s.task[started[0]]) < 80) {
    root.append(el("h2", {}, "Work on these first"));
    const box = el("div", { class: "bars" });
    for (const t of started.slice(0, 3).filter((t) => pct(s.task[t]) < 80)) box.append(barRow("task", `${t} ${TASKS[t]}`, s.task[t], () => practiceOnly({ task: t })));
    root.append(box);
  }
  root.append(el("h2", {}, "By domain"));
  const doms = el("div", { class: "bars" });
  for (let d = 1; d <= 5; d++) doms.append(barRow("", `${d}. ${DOMAINS[d].name} (${DOMAINS[d].weight}% of exam)`, s.dom[d], () => practiceOnly({ domain: d })));
  root.append(doms);
  root.append(el("div", { class: "key" },
    el("span", {}, el("i", { class: "strong" }), "80% or more"), el("span", {}, el("i", { class: "mid" }), "60 to 79%"),
    el("span", {}, el("i", { class: "weak" }), "Under 60%"), el("span", {}, el("i", {}), "Not started")));
  for (let d = 1; d <= 5; d++) {
    root.append(el("h2", {}, `Domain ${d} task statements`));
    const box = el("div", { class: "bars" });
    for (const t of TASK_IDS.filter((t) => t[0] === String(d))) box.append(barRow("task", `${t} ${TASKS[t]}`, s.task[t], () => practiceOnly({ task: t })));
    root.append(box);
  }
  root.append(el("p", { class: "note", style: "margin-top:1.5rem" }, "Select any row to practice only that area. Percentages use your latest answer to each question, so fixing a miss raises the score. Guesses count as not yet known."));
}

// ---------- data view ----------
function renderData(message) {
  const root = $("data");
  root.replaceChildren();
  const box = el("div", { class: "stack" });
  box.append(el("p", { class: "lead", style: "margin:0" }, "Progress is saved in this browser only. Export it to back it up or move it to another device."));
  if (message) box.append(el("p", { role: "status" }, el("b", {}, message)));
  box.append(el("button", { class: "btn", onclick: () => {
    const blob = new Blob([JSON.stringify(state, null, 1)], { type: "application/json" });
    const a = el("a", { href: URL.createObjectURL(blob), download: `ccaf-progress-${new Date().toISOString().slice(0, 10)}.json` });
    document.body.append(a); a.click(); a.remove();
  } }, `Export progress (${state.log.length} answers)`));
  const file = el("input", { type: "file", accept: "application/json,.json", id: "imp", onchange: async (e) => {
    try {
      const incoming = JSON.parse(await e.target.files[0].text());
      if (!Array.isArray(incoming.log)) throw new Error("no log");
      const seen = new Set(state.log.map((r) => r.id + ":" + r.at));
      const fresh = incoming.log.filter((r) => byId[r.id] && typeof r.at === "number" && !seen.has(r.id + ":" + r.at));
      state.log = state.log.concat(fresh).sort((a, b) => a.at - b.at);
      save(); renderHeader(); renderData(`Imported ${fresh.length} new answers.`);
    } catch { renderData("That file could not be read as exported progress."); }
  } });
  box.append(el("div", {}, el("label", { for: "imp" }, "Import progress and merge it with what is here"), el("br"), file));
  let armed = false;
  const reset = el("button", { class: "btn danger", onclick: () => {
    if (!armed) { armed = true; reset.textContent = "Erase all answers for good"; return; }
    state = blank(); save(); renderHeader(); startQuestion(); renderData("All answers erased.");
  } }, "Erase progress");
  box.append(reset);
  box.append(el("p", { class: "note" }, `${BANK.length} questions across ${TASK_IDS.length} task statements. Everything runs in this file. Nothing is sent anywhere.`));
  root.append(box);
}

// ---------- navigation ----------
function show(view) {
  for (const b of document.querySelectorAll("nav button")) b.setAttribute("aria-selected", String(b.dataset.view === view));
  for (const v of ["practice", "progress", "data"]) $(v).hidden = v !== view;
  if (view === "progress") renderProgress();
  if (view === "data") renderData();
}
for (const b of document.querySelectorAll("nav button")) b.addEventListener("click", () => show(b.dataset.view));
$("map").addEventListener("click", () => show("progress"));
document.addEventListener("keydown", (e) => {
  if ($("practice").hidden || e.metaKey || e.ctrlKey || e.altKey || e.target.matches("input")) return;
  const i = "1234".indexOf(e.key) >= 0 ? "1234".indexOf(e.key) : "abcd".indexOf(e.key.toLowerCase());
  if (i >= 0 && current.picked == null) { e.preventDefault(); answer(i); }
});
startQuestion();
</script>
</body>
</html>
