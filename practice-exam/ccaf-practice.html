<!DOCTYPE html>
<html lang="en">
<head>

<title>CCA Foundations practice</title>
<style>
:root {
  --paper: #EDF1F4; --sheet: #F8FAFB; --ink: #13283B; --muted: #55697A; --line: #C3CFD9;
  --blue: #1D5BB8; --blue-soft: #DCE7F6;
  --strong: #1B7F55; --mid: #B9860B; --weak: #BF4127; --unseen: transparent;
  --ui: "Avenir Next", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --read: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #0F1E2C; --sheet: #162A3C; --ink: #E6EDF3; --muted: #9DB0C0; --line: #33495C;
    --blue: #7FB0F5; --blue-soft: #1F3A57;
    --strong: #4CC08D; --mid: #E0B040; --weak: #F0785C;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--ui); font-size: 16px; line-height: 1.5; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
.wrap { max-width: 44rem; margin: 0 auto; padding: 0 1rem 4rem; }

header { padding: 1.25rem 0 0; }
h1 { font-size: 1.05rem; font-weight: 600; margin: 0 0 .75rem; letter-spacing: .01em; }

/* The coverage map: one cell per task statement, grouped by domain. */
.map { display: flex; gap: .625rem; width: 100%; padding: 0; margin: 0; border: 0; background: none; cursor: pointer; text-align: left; }
.map .grp { display: flex; gap: 3px; flex: var(--n) 1 0; min-width: 0; padding-top: 1.1rem; position: relative; border-top: 2px solid var(--ink); }
.map .grp > span.lab { position: absolute; top: .1rem; left: 0; font-size: .7rem; color: var(--muted); white-space: nowrap; }
.cell { flex: 1 1 0; height: 1.5rem; border: 1.5px solid var(--line); background: var(--unseen); position: relative; min-width: 0; }
.cell.weak { background: var(--weak); border-color: var(--weak); }
.cell.mid { background: var(--mid); border-color: var(--mid); }
.cell.strong { background: var(--strong); border-color: var(--strong); }
.cell.weak::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(135deg, transparent 0 3px, rgba(255,255,255,.45) 3px 4.5px); }
.cell.now { outline: 2.5px solid var(--ink); outline-offset: 1.5px; }
.ticker { margin: .6rem 0 0; font-size: .875rem; color: var(--muted); min-height: 1.4em; }
.ticker b { color: var(--ink); font-weight: 600; }

nav { display: flex; gap: 1.5rem; margin: 1.25rem 0 0; border-bottom: 1px solid var(--line); }
nav button { background: none; border: 0; padding: .55rem 0; cursor: pointer; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -1px; }
nav button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--blue); font-weight: 600; }

main { padding-top: 1.5rem; }
.where { font-size: .875rem; color: var(--muted); margin: 0 0 .75rem; }
.filter { display: inline-flex; align-items: center; gap: .5rem; font-size: .875rem; background: var(--blue-soft); padding: .25rem .25rem .25rem .7rem; margin: 0 0 1rem; border-radius: 2rem; }
.filter button { border: 0; background: var(--sheet); border-radius: 2rem; padding: .15rem .7rem; cursor: pointer; }
.q { font-family: var(--read); font-size: 1.22rem; line-height: 1.5; margin: 0 0 1.25rem; max-width: 38rem; }
.opts { list-style: none; margin: 0; padding: 0; display: grid; gap: .6rem; }
.opt { display: grid; grid-template-columns: 1.75rem 1fr; gap: .5rem; width: 100%; text-align: left; background: var(--sheet); border: 1.5px solid var(--line); border-radius: 6px; padding: .8rem .9rem; cursor: pointer; }
.opt .k { color: var(--muted); font-weight: 600; }
.opt:hover:not([disabled]) { border-color: var(--blue); }
.opt[disabled] { cursor: default; }
.opt.right { border-color: var(--strong); box-shadow: inset 4px 0 0 var(--strong); }
.opt.wrong { border-color: var(--weak); box-shadow: inset 4px 0 0 var(--weak); }
.opt .tag { display: block; font-size: .8rem; font-weight: 600; margin-top: .25rem; }
.opt.right .tag { color: var(--strong); } .opt.wrong .tag { color: var(--weak); }
.after { margin-top: 1.25rem; border-left: 3px solid var(--blue); padding: .1rem 0 .1rem 1rem; }
.after p { margin: 0 0 .9rem; max-width: 38rem; }
.row { display: flex; flex-wrap: wrap; gap: .75rem; align-items: center; }
.btn { background: var(--blue); color: #fff; border: 0; border-radius: 6px; padding: .65rem 1.1rem; cursor: pointer; font-weight: 600; }
@media (prefers-color-scheme: dark) { .btn { color: #0F1E2C; } }
.btn.quiet { background: none; color: var(--ink); border: 1.5px solid var(--line); font-weight: 400; }
.btn.danger { background: none; color: var(--weak); border: 1.5px solid var(--weak); font-weight: 400; }
.note { font-size: .875rem; color: var(--muted); }
label.sw { display: inline-flex; gap: .5rem; align-items: center; font-size: .9rem; cursor: pointer; }

h2 { font-size: 1rem; font-weight: 600; margin: 2rem 0 .75rem; }
h2:first-child { margin-top: 0; }
.lead { font-family: var(--read); font-size: 1.15rem; margin: 0 0 1.5rem; max-width: 38rem; }
.bars { display: grid; gap: .35rem; }
.bar { display: grid; grid-template-columns: minmax(0, 1fr) 3.2rem; grid-template-areas: "name pct" "track track" "sub sub"; column-gap: .75rem; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: .6rem 0; cursor: pointer; }
.bar .name { grid-area: name; } .bar .pct { grid-area: pct; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.bar .track { grid-area: track; height: .5rem; background: var(--blue-soft); margin: .35rem 0 .3rem; position: relative; }
.bar .fill { position: absolute; inset: 0 auto 0 0; background: var(--muted); }
.bar .fill.weak { background: var(--weak); } .bar .fill.mid { background: var(--mid); } .bar .fill.strong { background: var(--strong); }
.bar .sub { grid-area: sub; font-size: .8rem; color: var(--muted); }
.bar.task .name { font-size: .93rem; }
.bar:hover .name { color: var(--blue); }
.key { display: flex; flex-wrap: wrap; gap: 1rem; font-size: .8rem; color: var(--muted); margin: .75rem 0 0; }
.key i { display: inline-block; width: .8rem; height: .8rem; vertical-align: -1px; margin-right: .3rem; border: 1.5px solid var(--line); }
.key i.weak { background: var(--weak); border-color: var(--weak); } .key i.mid { background: var(--mid); border-color: var(--mid); } .key i.strong { background: var(--strong); border-color: var(--strong); }
.stack { display: grid; gap: 1rem; justify-items: start; }
input[type=file] { font: inherit; max-width: 100%; }
[hidden] { display: none !important; }
a { color: var(--blue); }
footer { margin-top: 3rem; border-top: 1px solid var(--line); padding-top: 1rem; }
</style>
</head>

  </footer>
</div>

<script>
const DOMAINS = [
  null,
  { name: "Agentic architecture and orchestration", short: "Agents", weight: 27 },
  { name: "Tool design and MCP integration", short: "Tools", weight: 18 },
  { name: "Claude Code configuration and workflows", short: "Claude Code", tag: "Config", weight: 20 },
  { name: "Prompt engineering and structured output", short: "Prompts", weight: 20 },
  { name: "Context management and reliability", short: "Reliability", weight: 15 },
];
const TASKS = {
  "1.1": "Agentic loops", "1.2": "Coordinator and subagents", "1.3": "Subagent invocation and context",
  "1.4": "Workflow enforcement and handoff", "1.5": "Agent SDK hooks", "1.6": "Task decomposition", "1.7": "Sessions, resume, and fork",
  "2.1": "Tool descriptions", "2.2": "Structured errors", "2.3": "Tool distribution and tool_choice", "2.4": "MCP server configuration", "2.5": "Built-in tools",
  "3.1": "CLAUDE.md hierarchy", "3.2": "Commands and skills", "3.3": "Path-specific rules", "3.4": "Plan mode or direct execution", "3.5": "Iterative refinement", "3.6": "CI/CD integration",
  "4.1": "Explicit criteria", "4.2": "Few-shot prompting", "4.3": "Structured output and schemas", "4.4": "Validation and retry", "4.5": "Batch processing", "4.6": "Multi-instance review",
  "5.1": "Conversation context", "5.2": "Escalation and ambiguity", "5.3": "Error propagation", "5.4": "Large-codebase context", "5.5": "Human review and confidence", "5.6": "Provenance and uncertainty",
};
const BANK = [{"id":"1.1-01","d":1,"t":"1.1","q":"A response comes back with stop_reason \"tool_use\" and two tool_use blocks. What should the agent loop do next?","o":["Run both tools, append both results to the conversation, and call the model again","Run the first tool only, since the model can request the second one again later","Return the response text to the user and wait for their next message","Call the model again immediately so it can decide which tool matters more"],"e":"\"tool_use\" means the model is waiting on results. Every requested tool runs, every result is appended to the history, and the loop continues."},{"id":"1.1-02","d":1,"t":"1.1","q":"An agent hits its iteration cap of 10 on long but legitimate tasks, while a short broken task spins for all 10 turns before stopping. What does this indicate about the loop's design?","o":["The cap, not stop_reason, is acting as the main stop","The cap is set too low and should be raised to around 50","The model needs a stronger instruction in its system prompt to finish every task within ten turns","The tools are too slow and should return results faster"],"e":"An arbitrary iteration cap as the primary stop cuts off real work and lets broken work run. The loop should end on stop_reason \"end_turn\", with a cap only as a safety net."},{"id":"1.1-03","d":1,"t":"1.1","q":"A team hard-codes every support request through the sequence lookup, verify, refund. Requests that don't need a refund, such as a shipping question, produce odd results. What approach better fits an agentic design?","o":["Let the model choose the next tool from context, and enforce only critical prerequisites in code","Add more branches to the hard-coded sequence so that each new request type gets its own dedicated path","Run all three steps anyway and discard the results that turn out not to apply","Ask the user to pick a request type from a menu before the sequence starts"],"e":"Model-driven decision-making lets Claude pick the next tool based on the situation. Fixed decision trees break on inputs they didn't anticipate. Only rules that must always hold need code enforcement."},{"id":"1.1-04","d":1,"t":"1.1","q":"An agent calls lookup_order with the same arguments four times in a row and never answers. Each call succeeds. What is the most likely cause?","o":["Tool results aren't being appended to the conversation history","The tool's description is too vague for the model to understand what the output it receives means","The model's max_tokens setting is too low to produce a final answer","The system prompt does not tell the agent to stop after one lookup"],"e":"The model has no memory between requests. If results aren't added to the history, it never sees them and keeps asking for the same thing."},{"id":"1.1-05","d":1,"t":"1.1","q":"A developer ends the agent loop when the reply text contains the phrase \"task complete\". Sometimes the agent stops early, and sometimes it never stops. What should replace this check?","o":["Stop when stop_reason is \"end_turn\" and continue when it is \"tool_use\"","A longer list of completion phrases such as \"done\" and \"finished\"","A second model call that judges whether the reply sounds complete","A rule that stops after the first reply containing any text"],"e":"Natural-language signals are unreliable for loop control. stop_reason is the structured signal the API provides for exactly this."},{"id":"1.1-06","d":1,"t":"1.1","q":"A loop treats any stop_reason other than \"tool_use\" as completion. Users occasionally receive answers that end mid-sentence. Which stop_reason is being mishandled?","o":["\"max_tokens\", meaning the output was cut off","\"end_turn\", which means the model wants another turn before it can finish","\"tool_use\", which means a tool returned an error","\"stop_sequence\", which means the tool list was empty"],"e":"\"max_tokens\" signals truncation. It should be handled separately, for example by raising the limit or continuing, and never treated as a finished answer."},{"id":"1.2-01","d":1,"t":"1.2","q":"In a hub-and-spoke research system, the document-analysis subagent realizes it needs two more sources. What should happen?","o":["It tells the coordinator, which delegates the search","It messages the search subagent directly to request the sources","It is given the search tool directly so that it can fetch whatever extra sources it needs without waiting","It proceeds without them and notes nothing, to avoid slowing the pipeline"],"e":"All communication routes through the coordinator. That keeps one place for observability, error handling, and control over what each subagent knows."},{"id":"1.2-02","d":1,"t":"1.2","q":"A coordinator sends every query through all four subagents: search, analysis, synthesis, and report. A user asking for one known statistic waits two minutes and pays for four agents. What should change?","o":["The coordinator should assess each query and invoke only the subagents it needs","The four subagents should run in parallel so the wait is shorter","The subagents should use a cheaper model for simple queries","The pipeline should cache every answer so repeats are instant"],"e":"A coordinator's job includes dynamic selection. Routing everything through the full pipeline regardless of need wastes time and money."},{"id":"1.2-03","d":1,"t":"1.2","q":"A report on \"the effects of remote work\" covers only productivity metrics. Every subagent completed successfully. The coordinator's log shows it assigned \"output per hour\", \"meeting load\", and \"focus time\". What is the root cause?","o":["The coordinator's decomposition was too narrow","The search subagent's queries were not broad enough","The synthesis subagent failed to flag missing areas","The analysis subagent filtered out the sources that were not about productivity"],"e":"Each subagent did what it was asked. The assignments themselves omitted areas such as wellbeing, hiring, and cost, which is a coordinator decomposition failure."},{"id":"1.2-04","d":1,"t":"1.2","q":"Why does a hub-and-spoke design route all inter-agent communication through the coordinator instead of letting subagents talk to each other?","o":["It centralizes observability, error handling, and information flow","It reduces total token usage because subagents share one context window","It lets every subagent inherit the coordinator's full conversation history automatically, with no extra prompting","It removes the need for subagents to have their own system prompts"],"e":"Centralized routing is about visibility and control. Subagents still have isolated contexts and do not inherit anything automatically."},{"id":"1.2-05","d":1,"t":"1.2","q":"After the first synthesis, a coordinator notices that one of the five areas it planned has only a single weak source. What is the recommended next step?","o":["Re-delegate a targeted search for that area, then run synthesis again","Publish the report and trust readers to notice the thin section","Ask the synthesis subagent to write more about that area from what it has","Restart the entire pipeline from the beginning with a broader prompt"],"e":"This is the iterative refinement loop: evaluate the synthesis for gaps, re-delegate targeted work, and re-synthesize until coverage is sufficient."},{"id":"1.2-06","d":1,"t":"1.2","q":"Two search subagents working on the same research topic return largely the same eight sources. What coordinator change best prevents this?","o":["Assign each subagent a distinct subtopic or source type in its prompt","Have the subagents exchange their result lists before returning","Deduplicate the sources in the synthesis subagent","Run the two subagents one after the other instead of in parallel"],"e":"Duplication comes from overlapping assignments. Partitioning the research space at delegation time fixes the cause; deduplicating later only hides the wasted work."},{"id":"1.3-01","d":1,"t":"1.3","q":"A coordinator's system prompt describes three subagents, but it never spawns any and tries to do all the work itself. Its allowedTools list contains only the research tools. What is missing?","o":["\"Task\" in allowedTools, the tool that spawns subagents","A larger max_turns value, so that it has enough turns left over to delegate","A fork_session setting to create the subagent sessions","A PostToolUse hook to route results to the subagents"],"e":"Subagents are spawned through the Task tool. A coordinator can't invoke it unless \"Task\" is in its allowedTools."},{"id":"1.3-02","d":1,"t":"1.3","q":"A coordinator needs three independent searches done as fast as possible. How does it run them in parallel?","o":["Emit three Task tool calls in a single response","Emit one Task call per turn in three consecutive turns","Set a parallel flag in each subagent's AgentDefinition","Ask one subagent to start the other two before it begins"],"e":"Parallel subagents come from multiple Task calls in one coordinator response. One call per turn runs them sequentially."},{"id":"1.3-03","d":1,"t":"1.3","q":"A coordinator passes its search results to the synthesis subagent as two paragraphs of prose. The final report makes accurate claims but can't say which source each came from. What should change?","o":["Pass structured findings that keep each claim with its source","Give the synthesis subagent the search tool so it can find each source again and rebuild the citations","Ask the report subagent to add plausible citations at the end","Increase the synthesis subagent's context window"],"e":"Attribution has to travel with the content. Structured formats that separate content from metadata preserve it across handoffs; prose summaries drop it."},{"id":"1.3-04","d":1,"t":"1.3","q":"A coordinator tells its search subagent: \"Run these three queries in this order, then return the top two hits from each.\" When the first query returns nothing, the subagent returns almost empty-handed. What prompt change helps most?","o":["State the research goal and what a good result looks like, and let the subagent choose its queries","Add a fourth and fifth fallback query to the scripted list","Tell the subagent to return an error whenever any query is empty","Have the coordinator run the queries itself and pass the results along"],"e":"Subagent prompts should give goals and quality criteria, not step-by-step procedures. A scripted subagent can't adapt when a step fails."},{"id":"1.3-05","d":1,"t":"1.3","q":"You need a subagent that reviews files with its own instructions and can only read, never edit. What configures this?","o":["An AgentDefinition with a prompt and tool list","A separate API key that has read-only permissions","A line in the coordinator's prompt asking the subagent to follow its instructions and not to edit files","A fork_session call made before the subagent starts"],"e":"AgentDefinition is where a subagent's description, system prompt, and tool restrictions are set."},{"id":"1.3-06","d":1,"t":"1.3","q":"A coordinator invokes the same analysis subagent twice. The second prompt says \"Continue from where you left off.\" The subagent starts over. Why?","o":["Each invocation starts fresh; pass prior results in","The subagent's session expired between the two calls, so its earlier working memory was cleared out","The coordinator did not include \"Task\" in allowedTools","The subagent needs fork_session enabled to keep its memory"],"e":"Subagents don't carry memory between invocations and don't inherit the coordinator's history. Anything they need must be in the prompt."},{"id":"1.4-01","d":1,"t":"1.4","q":"Logs show a support agent calls process_refund before get_customer in 8% of cases, sometimes refunding the wrong account. The system prompt already says to verify first. What is the most effective fix?","o":["A programmatic gate that blocks process_refund until get_customer has returned a verified ID","Few-shot examples showing verification before every refund","A stronger, more prominent instruction in the system prompt","A routing classifier that enables only relevant tools per request"],"e":"When a specific order is required for a critical action, code must enforce it. Prompt-based approaches leave a non-zero failure rate."},{"id":"1.4-02","d":1,"t":"1.4","q":"Human agents receiving escalations say they have to ask the customer to repeat everything. They don't have access to the chat transcript. What should the AI agent produce at escalation?","o":["A structured handoff: ID, root cause, amount, next step","A one-line note saying the customer needs help from a human","The full list of tool calls it made, in order","A sentiment score and a tone summary, so the human knows how upset the customer is before replying"],"e":"The receiver has no context, so the handoff must stand alone: who the customer is, what went wrong, what's at stake, and what to do next."},{"id":"1.4-03","d":1,"t":"1.4","q":"A customer writes one message with three problems: a late order, a double charge, and a login issue. The agent resolves the late order and ends the conversation. What approach handles this correctly?","o":["Split it into separate items, investigate each, and reply once","Handle the first issue fully, then ask the customer to open new chats for each of the other problems","Escalate to a human because multi-issue requests are too complex","Answer whichever issue has the highest dollar value and ignore the rest"],"e":"Multi-concern requests are decomposed into separate items, investigated (in parallel where possible, with shared context), and synthesized into a unified reply."},{"id":"1.4-04","d":1,"t":"1.4","q":"Which of these requirements calls for programmatic enforcement instead of prompt guidance?","o":["Identity must be verified before any wire transfer is initiated","Replies should use a friendly, professional tone","The agent should prefer concise answers over long ones","The agent should greet returning customers by name"],"e":"Tone and style are judgment calls suited to prompts. A rule with financial consequences that must hold every time needs deterministic enforcement."},{"id":"1.4-05","d":1,"t":"1.4","q":"To gate lookup_order behind identity verification, a developer adds a boolean parameter customer_verified that the model sets to true when calling the tool. Why is this insufficient?","o":["The model supplies the value, so it can claim a verification that never happened","The parameter increases token usage on every tool call","The model cannot see parameters it sets on earlier calls","Tool input schemas do not support boolean parameters"],"e":"A gate must rest on state set by your code when get_customer actually succeeds. A flag the model fills in is just another instruction it might get wrong."},{"id":"1.4-06","d":1,"t":"1.4","q":"A compliance team requires that every data export has a logged manager approval, with no exceptions. An engineer proposes adding detailed instructions and five examples to the prompt. What is wrong with this plan?","o":["Prompts are probabilistic; this rule allows no misses","Five examples are too few, and the guide recommends at least ten","Examples make the model less likely to follow written instructions","The instructions belong in the user message, not the system prompt"],"e":"\"No exceptions\" is the signal. Deterministic compliance needs a programmatic prerequisite or hook, because prompts are probabilistic."},{"id":"1.5-01","d":1,"t":"1.5","q":"An agent uses a payments tool that returns status as a number: 1, 2, or 3. The agent sometimes misreads 2 as \"complete\". You can't change the tool. What is the best fix?","o":["A PostToolUse hook that maps the codes to words","A table of status codes added to the system prompt","Few-shot examples showing each code interpreted correctly","A second tool that the agent can call whenever it needs a numeric status code translated"],"e":"PostToolUse hooks transform tool results deterministically before the model processes them, so it never has to interpret raw codes."},{"id":"1.5-02","d":1,"t":"1.5","q":"A banking agent must never initiate transfers over $10,000 without human review. Where should this rule be enforced?","o":["In a hook that intercepts the transfer tool call, blocks it over the limit, and redirects to review","In the first line of the system prompt, stated as a hard rule","In the transfer tool's description, so the model reads it at decision time","In few-shot examples that show the agent declining large transfers"],"e":"Tool call interception hooks block policy-violating actions deterministically and can redirect to an alternative workflow such as human escalation."},{"id":"1.5-03","d":1,"t":"1.5","q":"A CRM tool returns full customer records including government ID numbers that the agent never needs. You want those values removed before the model processes any result. What is the right mechanism?","o":["A PostToolUse hook that strips the fields from every result","An instruction telling the model to ignore ID numbers in results","A PreToolUse hook that blocks the CRM tool entirely","A larger context window so the extra fields do no harm"],"e":"PostToolUse hooks intercept results for transformation before the model sees them. An instruction to ignore data still puts the data in context."},{"id":"1.5-04","d":1,"t":"1.5","q":"A hook blocks refunds over $500 and returns the message \"Denied.\" The agent retries the same refund three times, then apologizes vaguely to the customer. How should the hook change?","o":["Return why it was blocked and what to do instead","Block the refund tool permanently after the first denial","Return an empty success result, so the agent believes the refund went through and moves on","Remove the message so the agent gets no feedback at all"],"e":"A denial should redirect. Telling the agent the reason and the alternative workflow turns a dead end into a correct next step."},{"id":"1.5-05","d":1,"t":"1.5","q":"Which statement correctly contrasts hooks with prompt instructions for enforcing a business rule?","o":["Hooks are deterministic; prompt instructions are probabilistic","Hooks are suggestions the model may override, while prompts are binding","Hooks and prompts are about equally reliable in practice, so the choice between them is mostly about readability","Hooks only work on built-in tools, while prompts work on MCP tools"],"e":"A hook runs as code on every matching call. A prompt influences behavior but cannot guarantee it."},{"id":"1.5-06","d":1,"t":"1.5","q":"A third-party MCP server you can't modify returns timestamps in three different formats depending on the endpoint. What is the most reliable way to give the agent consistent data?","o":["Normalize the formats in a PostToolUse hook","Describe all three formats in the system prompt","Ask the vendor's tool to be called twice and compare the results","Tell the agent to ask the user which format is in use"],"e":"When you can't change the tool, a PostToolUse hook is where heterogeneous formats are normalized before the agent reasons about them."},{"id":"1.6-01","d":1,"t":"1.6","q":"Every pull request needs the same three checks in the same order: style, security, then test coverage. Which decomposition pattern fits?","o":["Prompt chaining: a fixed sequence of focused steps","Dynamic decomposition that generates subtasks as it discovers things","A coordinator that decides at run time which checks to skip","A single prompt that performs all three checks at once"],"e":"When the steps are known in advance and always the same, a fixed sequential pipeline is the right fit."},{"id":"1.6-02","d":1,"t":"1.6","q":"The task is \"add comprehensive tests to a legacy codebase nobody fully understands.\" How should the agent approach it?","o":["Map the structure, find high-impact areas, and build a prioritized plan that adapts as it learns","Follow a fixed pipeline that writes tests file by file in alphabetical order until every file is covered","Write tests for the largest files first, since size indicates importance","Generate tests for every function in one pass using a single large prompt"],"e":"Open-ended investigation calls for adaptive decomposition: explore first, prioritize, and revise the plan based on what is found."},{"id":"1.6-03","d":1,"t":"1.6","q":"A single-pass review of a 20-file pull request gives deep feedback on some files and shallow feedback on others, and flags a pattern in one file that it approves in another. What restructuring addresses this?","o":["Review each file in its own pass, then run a separate pass for cross-file issues","Use a model with a larger context window for the single pass","Run the single pass three times and keep findings that appear twice","Ask developers to split every change into smaller pull requests"],"e":"The cause is attention dilution. Per-file local passes give consistent depth, and a separate integration pass covers cross-file concerns."},{"id":"1.6-04","d":1,"t":"1.6","q":"Which task is the best fit for dynamic, adaptive decomposition over a fixed prompt chain?","o":["Finding the root cause of an intermittent failure","Converting a batch of invoices to a known JSON format","Running the same lint, build, and test steps on every commit","Translating a document, then proofreading it, then formatting it for publication"],"e":"A root-cause hunt depends on what each step uncovers. The other three have steps that are known before work starts."},{"id":"1.6-05","d":1,"t":"1.6","q":"A pipeline extracts fields from a form, validates them, then formats a summary. The steps never vary. An engineer proposes a coordinator with dynamically spawned subagents. What is the better design?","o":["A simple prompt chain, since the workflow is predictable","The coordinator design, since it scales better to new step types","A single agent with all tools and no defined sequence","Parallel subagents that each do all three steps and vote"],"e":"Predictable multi-step work suits prompt chaining. Dynamic orchestration adds cost and unpredictability the task doesn't need."},{"id":"1.7-01","d":1,"t":"1.7","q":"A developer spent the afternoon investigating a memory leak in a named Claude Code session and wants to continue tomorrow with that context intact. The code won't change overnight. What should they use?","o":["--resume with the session name","fork_session to copy the session first","A new session with no prior context","/compact, then a new session"],"e":"--resume continues a specific prior conversation. It's the right choice when the earlier context is still valid."},{"id":"1.7-02","d":1,"t":"1.7","q":"After a long analysis of a module, a developer wants to try two different refactoring strategies and compare them, without either attempt affecting the other. What fits?","o":["fork_session, giving two independent branches","--resume the same session twice in a row","Two brand-new sessions that each redo the whole analysis from the beginning","One session that tries the first strategy, then the second"],"e":"Forking creates independent branches from a shared baseline, which is the pattern for exploring divergent approaches."},{"id":"1.7-03","d":1,"t":"1.7","q":"A developer returns to a week-old session. Since then, most of the files it analyzed have been rewritten. What is the most reliable way to continue the work?","o":["Start a new session and inject a structured summary of what is still relevant","Resume the session and trust its earlier analysis","Fork the old session so the stale context is isolated","Resume and ask Claude to double-check everything it remembers"],"e":"When prior tool results are stale, a fresh session with a structured summary is more reliable than resuming with outdated context."},{"id":"1.7-04","d":1,"t":"1.7","q":"What happens to the original session when it is forked?","o":["It is unchanged, and the fork continues independently from a copy of its context","It is closed and can no longer be resumed","It receives every message later sent to the fork","Its stale tool results are refreshed from disk automatically as part of the fork operation"],"e":"A fork is an independent branch from the same baseline. It copies the context as it stands, including anything stale, and leaves the original alone."},{"id":"1.7-05","d":1,"t":"1.7","q":"Which situation most favors starting a new session with an injected summary over resuming the old one?","o":["The earlier tool results describe code that has since changed","The earlier session was productive and ended yesterday, and no code has changed since then","The developer wants to ask one follow-up question about the same findings","The earlier session has a clear, descriptive name"],"e":"Resumption is only as good as the context it restores. Stale tool results are the main reason to start clean."},{"id":"2.1-01","d":2,"t":"2.1","q":"A research agent has one tool, analyze_document, described as \"Analyzes a document.\" It is used for extracting figures, summarizing, and checking claims, and the output quality varies widely. What redesign helps most?","o":["Split it into purpose-specific tools, each with defined inputs and outputs","Keep the one tool and add a longer system prompt explaining its three uses","Add a mode parameter and let the model guess which mode fits","Run the tool three times per document and merge the outputs"],"e":"A generic tool with a vague contract produces vague results. Splitting it into tools such as extract_data_points, summarize_content, and verify_claim gives each a clear purpose and contract."},{"id":"2.1-02","d":2,"t":"2.1","q":"An agent has analyze_content, used for web search results, and analyze_document, used for uploaded files. Their descriptions are nearly the same and the agent mixes them up. What is the most direct fix?","o":["Rename analyze_content to something like extract_web_results and describe its web-specific purpose","Remove analyze_document so there is only one tool to choose from","Add a rule to the system prompt listing which tool to use for which input","Raise the temperature so the model explores both tools more evenly"],"e":"Overlapping names and descriptions cause misrouting. Renaming and rewriting the description removes the overlap at its source."},{"id":"2.1-03","d":2,"t":"2.1","q":"Tool descriptions are clear and distinct, yet the agent calls get_customer for every message that mentions the word \"order\". The system prompt includes: \"For anything about an order, always start with the customer profile.\" What should you examine first?","o":["The system prompt wording, which ties \"order\" to that tool","The tool descriptions, which probably need more example queries to separate the customer and order lookups","The model version, which may handle tool selection poorly","The tool input schemas, which may be missing required fields"],"e":"Keyword-sensitive instructions in a system prompt can override well-written tool descriptions. Review the prompt for wording that creates unintended tool associations."},{"id":"2.1-04","d":2,"t":"2.1","q":"Which set of contents makes a tool description most useful for reliable selection?","o":["Input formats, example queries, edge cases, and boundaries","The tool's name restated as a full sentence, plus its author, its version, and the date it was last changed","A one-line summary kept as short as possible to save tokens","The implementation details of the function behind the tool"],"e":"The model chooses tools from their descriptions. Inputs, examples, edge cases, and boundaries against similar tools are what let it choose correctly."},{"id":"2.1-05","d":2,"t":"2.1","q":"An agent worked well with five tools. A sixth is added, search_notes, described as \"Searches and returns matching records\", which is almost word for word what search_tickets says. Now ticket queries sometimes go to search_notes. What explains this?","o":["The near-identical descriptions leave the model no basis for telling the two tools apart","Six tools exceeds the number a model can select from reliably","New tools are always preferred over older ones in the tool list","The new tool's schema is overriding the older tool's schema"],"e":"Selection degrades when descriptions overlap. The fix is to differentiate what each tool searches and when to use it."},{"id":"2.1-06","d":2,"t":"2.1","q":"An agent keeps passing order numbers such as ORD-4471 to a tool that expects a customer ID such as C-2093. The tool's description says only \"Looks up an account.\" What is the best first change?","o":["Document the expected ID format, with an example","Add a validation retry loop that tries the lookup again with a different identifier whenever it fails","Merge the order and customer lookups into a single tool","Add a classifier that detects identifier types before each call"],"e":"The description doesn't say what input is accepted. Documenting the format with an example is the low-effort fix for the root cause."},{"id":"2.2-01","d":2,"t":"2.2","q":"How does an MCP tool signal to the agent that a call failed?","o":["By setting the isError flag in the tool result","By returning an empty content array","By raising an exception that ends the agent loop","By returning an HTTP 500 status to the model"],"e":"The MCP isError flag marks a result as a failure so the agent can react, while the loop keeps running."},{"id":"2.2-02","d":2,"t":"2.2","q":"A refund tool rejects a request because the amount exceeds what policy allows for that product. How should the error be categorized, and what should the agent do?","o":["A business error, not retryable; the agent explains the policy to the customer","A transient error, retryable; the agent tries again after a short wait","A validation error, retryable; the agent reformats the amount and resends the request","A permission error, retryable; the agent requests elevated access"],"e":"A policy refusal is a business error. Retrying can't succeed, so the response should say so and give an explanation the agent can pass on."},{"id":"2.2-03","d":2,"t":"2.2","q":"An order search tool catches database timeouts and returns an empty list. Customers with real orders are told \"I can't find any orders on your account.\" What is wrong?","o":["A failed lookup is being reported as a valid empty result, so the agent can't tell them apart","The tool should return the customer's most recent cached orders instead","The agent should always tell customers to try again later after any search","The empty list should include a count field set to zero"],"e":"\"Couldn't search\" and \"searched, found nothing\" need opposite reactions. An access failure must come back as an error, not as a successful empty result."},{"id":"2.2-04","d":2,"t":"2.2","q":"An agent retries a tool call six times after the tool reports that the customer's account is closed. Which piece of error metadata would have prevented this?","o":["A retryable flag set to false, with an explanation","A timestamp of when the error occurred","The internal stack trace from the server that handled it","A unique identifier for the failed request"],"e":"Marking an error as non-retryable, with a reason, tells the agent to stop and choose another path."},{"id":"2.2-05","d":2,"t":"2.2","q":"A search subagent hits a brief network blip on one query. What is the recommended handling?","o":["Retry locally; report up only if it persists","Report the failure to the coordinator immediately, so that it can decide whether a retry is worth attempting","Return an empty result so the pipeline is not delayed","Stop all work and wait for a human to confirm the network is back"],"e":"Subagents recover locally from transient failures. Only what they can't resolve goes up, with partial results and a record of what was attempted."},{"id":"2.2-06","d":2,"t":"2.2","q":"A tool is asked for a record the current caller isn't allowed to see. Which response is best?","o":["An error categorized as a permission failure, marked non-retryable, without the record's contents","A transient error so the agent retries until access is granted","The record with sensitive fields replaced by placeholder text","A generic \"Operation failed\" message with no further detail"],"e":"Categorizing it as a permission error tells the agent that retrying is pointless and that details must not be shared."},{"id":"2.3-01","d":2,"t":"2.3","q":"An agent has 18 tools available, from email to database migration. It increasingly picks the wrong one for simple requests. What is the most effective change?","o":["Give each agent only the 4 to 5 tools its role needs","Sort the tool list alphabetically so it is easier to scan","Add a sentence to each description saying \"use only when appropriate\"","Raise max_tokens so the model can reason longer about tool choice"],"e":"Too many tools degrades selection reliability. Scoping each agent to its role's tools reduces decision complexity."},{"id":"2.3-02","d":2,"t":"2.3","q":"A synthesis agent was given the full tool set \"for flexibility\". It now runs its own web searches mid-synthesis, and its reports cite sources no one else in the pipeline saw. What is the fix?","o":["Restrict it to the tools its role needs","Tell it in the prompt to search only when necessary","Give the other agents the same full tool set for consistency","Add a hook that logs each search it runs, so the extra sources can be traced afterward"],"e":"Agents with tools outside their specialization tend to misuse them. Scoped tool access keeps each agent on its job and keeps provenance traceable."},{"id":"2.3-03","d":2,"t":"2.3","q":"A contract-review agent needs to confirm a date or party name several times per document. Each check currently goes to the coordinator and then to a lookup agent, adding three round trips. Most checks are trivial. What is the best design?","o":["Give the review agent a narrow lookup tool for simple checks; complex research stays with the coordinator","Give the review agent every tool the lookup agent has","Have the review agent collect all of its checks and send them to the coordinator in one single batch at the end","Have the lookup agent pre-fetch everything the review agent might need"],"e":"A scoped cross-role tool handles the high-frequency simple case directly while preserving the coordination pattern for complex work."},{"id":"2.3-04","d":2,"t":"2.3","q":"A pipeline must always extract document metadata before any enrichment tools run. The model sometimes calls an enrichment tool first. How do you guarantee the order?","o":["Force the metadata tool via tool_choice first","Set tool_choice to \"auto\" and list the tools in the required order, with the metadata tool placed first","Put the metadata tool's description in capital letters","Set tool_choice to \"any\" so some tool is always called"],"e":"Forced tool selection, naming the tool in tool_choice, guarantees that specific tool runs first. Follow-up steps happen in subsequent turns."},{"id":"2.3-05","d":2,"t":"2.3","q":"With tool_choice set to \"auto\", which outcome is possible?","o":["The model answers in plain text without calling any tool","The model is required to call exactly one tool","The model must call every available tool once","The request is rejected if no tool is relevant"],"e":"\"auto\" leaves the decision to the model, including the decision not to call a tool at all."},{"id":"2.3-06","d":2,"t":"2.3","q":"A document agent has a general fetch_url tool. It occasionally uses it to hit unrelated endpoints it finds mentioned in documents. What is the better tool design?","o":["Replace it with a constrained tool such as load_document","Keep fetch_url as it is and add a prompt instruction telling the agent to use it only for document links","Add a second general tool so the agent has an alternative","Remove all fetching and ask users to paste document text"],"e":"Replacing a generic tool with a constrained alternative limits the agent to the intended use by construction."},{"id":"2.4-01","d":2,"t":"2.4","q":"A team wants every developer to get the same Jira MCP server in Claude Code, while one developer also wants to try an experimental server alone. Where does each go?","o":["Shared in .mcp.json, experimental in ~/.claude.json","Both in ~/.claude.json, since MCP servers are always personal","Both in .mcp.json, with a comment marking one as experimental","The shared server in the project CLAUDE.md, and the experimental one in a file under .claude/rules/"],"e":"Project-scoped servers in .mcp.json are shared through version control. User-scoped servers in ~/.claude.json stay personal."},{"id":"2.4-02","d":2,"t":"2.4","q":"A project's .mcp.json needs an API token for a shared server. How should the token be provided?","o":["Reference an environment variable such as ${GITHUB_TOKEN} and let each developer supply it","Commit the token in .mcp.json so everyone has the same one","Put the token in the project CLAUDE.md under a credentials heading","Hard-code the token in the MCP server's tool descriptions"],"e":"Environment variable expansion in .mcp.json keeps credentials out of version control while the configuration itself is shared."},{"id":"2.4-03","d":2,"t":"2.4","q":"A team needs Claude Code to read and update Jira tickets. An engineer offers to build a custom MCP server over two sprints. What should be considered first?","o":["Using an existing community Jira MCP server","Building the custom server anyway, since third-party MCP servers cannot be configured for a team's needs","Skipping MCP and pasting ticket text into each session by hand","Writing the integration as a slash command instead of a server"],"e":"For standard integrations, existing community servers are preferred. Custom servers are for workflows nothing existing covers."},{"id":"2.4-04","d":2,"t":"2.4","q":"An agent spends a dozen tool calls at the start of each session listing projects, then boards, then issues, just to learn what exists. What MCP feature reduces this?","o":["Resources that expose a catalog, such as issue summaries or a schema, with no exploratory calls","A larger tool timeout and page size, so that each listing call returns more of the workspace at once","A second MCP server that mirrors the first","Tool annotations that mark the listing tools as read-only"],"e":"MCP resources expose content catalogs to the agent, giving visibility into available data without spending tool calls on discovery."},{"id":"2.4-05","d":2,"t":"2.4","q":"A team connects an MCP server with a powerful code-search tool, but Claude Code keeps using built-in Grep instead. The MCP tool's description is \"Search code.\" What is the most likely fix?","o":["Expand the MCP tool's description of what it does and returns","Disable the built-in Grep tool for the whole team","Move the MCP server from project scope to user scope so that it loads earlier","Restart Claude Code so the tools are discovered in a new order"],"e":"With a thin description, the agent has no reason to prefer the MCP tool. Describing what it does and returns is what gets it chosen."},{"id":"2.5-01","d":2,"t":"2.5","q":"You need to find every file in a repository named like *.test.tsx, wherever it lives. Which built-in tool fits?","o":["Glob","Grep","Read","Edit"],"e":"Glob matches file paths by name or extension pattern. Grep searches inside file contents."},{"id":"2.5-02","d":2,"t":"2.5","q":"You need to find every place the function calculateTax is called across a codebase. Which built-in tool fits?","o":["Grep","Glob","Write","Edit"],"e":"Grep searches file contents for a pattern, which is what finding callers, imports, or error messages requires."},{"id":"2.5-03","d":2,"t":"2.5","q":"Claude tries to use Edit to change a line, but the text it targets appears four times in the file and the edit fails. What is the reliable fallback?","o":["Read the full file, then Write the corrected version","Run the same Edit again until it succeeds","Use Glob to locate the right occurrence","Use Grep to replace all four occurrences at once"],"e":"Edit needs a unique text match. When the anchor isn't unique, Read plus Write is the fallback for a reliable change."},{"id":"2.5-04","d":2,"t":"2.5","q":"What is the recommended way to build understanding of an unfamiliar codebase with built-in tools?","o":["Grep for entry points, then Read to follow imports","Read every file in the repository before answering anything","Glob for every file in the repository and Read them all in alphabetical order first","Use Bash to print the whole repository into the conversation"],"e":"Incremental exploration keeps context focused. Reading everything up front fills the context window before the real work starts."},{"id":"3.1-01","d":3,"t":"3.1","q":"A contractor clones the repo and finds that Claude Code doesn't follow the team's API naming rules, though it does for every long-time team member. Where are the rules most likely stored?","o":["In each long-time member's ~/.claude/CLAUDE.md","In the project's root CLAUDE.md, which contractors cannot read","In .claude/rules/, which only loads for repository owners","In .mcp.json, which depends on an environment variable the contractor has not set"],"e":"User-level settings apply only to that user and are not shared through version control. Team rules belong at the project level."},{"id":"3.1-02","d":3,"t":"3.1","q":"A project's CLAUDE.md has grown to 900 lines covering testing, API design, deployment, and security. It is hard to maintain and review. What is the recommended restructuring?","o":["Split it into focused topic files, referenced with @import or placed in .claude/rules/","Move the whole file to ~/.claude/CLAUDE.md to keep the repo clean","Delete the sections that are used least often","Convert every section into a separate slash command"],"e":"@import and .claude/rules/ topic files keep project instructions modular while still shared with the team."},{"id":"3.1-03","d":3,"t":"3.1","q":"Claude Code follows a convention in one developer's sessions and ignores it in another's, on the same branch. What is the quickest way to diagnose this?","o":["Run /memory in each session to see which memory files are loaded","Reinstall Claude Code on the second developer's machine and compare","Add the convention to the system prompt of both sessions by hand","Ask Claude in each session whether it knows the convention"],"e":"/memory shows which instruction files are loaded, which is the direct way to diagnose inconsistent behavior across sessions."},{"id":"3.1-04","d":3,"t":"3.1","q":"Which location makes instructions apply to everyone who works on a project?","o":["A CLAUDE.md in the repository root or in .claude/","~/.claude/CLAUDE.md on the tech lead's machine","A README.md section titled \"For Claude\"","An environment variable set in each developer's shell"],"e":"Project-level CLAUDE.md files are version-controlled and loaded for everyone who works in the repo."},{"id":"3.1-05","d":3,"t":"3.1","q":"A monorepo has shared standards files for security, testing, and accessibility. The payments package needs security and testing; the UI package needs testing and accessibility. How should each package get the right ones?","o":["Each package's CLAUDE.md imports what it needs","All three files are pasted in full into the root CLAUDE.md","Each developer copies the files they want into ~/.claude/","The standards are converted into three skills that developers invoke whenever they think one applies"],"e":"@import lets each package's CLAUDE.md selectively include the standards that apply, without duplicating content."},{"id":"3.2-01","d":3,"t":"3.2","q":"You want a /release-notes command that every developer gets automatically when they clone or pull the repo. Where does its file go?","o":[".claude/commands/ in the repository","~/.claude/commands/ in each developer's home directory","The root CLAUDE.md, under a commands heading",".mcp.json, in a commands array"],"e":"Project-scoped commands live in .claude/commands/ and are shared through version control. The home-directory version is personal."},{"id":"3.2-02","d":3,"t":"3.2","q":"A /brainstorm skill generates long lists of alternatives. After running it, the main session loses track of the task it was working on. Which frontmatter option addresses this?","o":["context: fork","allowed-tools","argument-hint","description"],"e":"context: fork runs the skill in an isolated subagent context, so verbose or exploratory output doesn't pollute the main conversation."},{"id":"3.2-03","d":3,"t":"3.2","q":"A team skill that reorganizes documentation should be able to write files but must never run shell commands. Which frontmatter option enforces that during the skill's execution?","o":["allowed-tools, listing only the file tools it needs","context: fork, which disables shell access","argument-hint, describing the restriction","A sentence in the skill body asking it not to use Bash"],"e":"allowed-tools restricts which tools a skill can use while it runs, for example limiting it to file writes to prevent destructive actions."},{"id":"3.2-04","d":3,"t":"3.2","q":"A /migrate skill needs a table name. Developers often invoke it with nothing, and the skill wastes a turn asking. Which frontmatter option helps?","o":["argument-hint, which prompts for the required parameter at invocation","context: fork, which collects arguments in a subagent","allowed-tools, which makes arguments mandatory","paths, which infers the table from the current file"],"e":"argument-hint tells developers what to supply when they invoke a skill without arguments."},{"id":"3.2-05","d":3,"t":"3.2","q":"A team has a detailed 60-line procedure for cutting a release, used about twice a month. Where should it live?","o":["In a skill, loaded on demand when someone runs it","In the project CLAUDE.md, so it is always available","In ~/.claude/CLAUDE.md on the release manager's machine","In a path-scoped rule matching every file in the repo"],"e":"Skills are for on-demand, task-specific workflows. CLAUDE.md is always loaded and should hold universal standards, not occasional procedures."},{"id":"3.3-01","d":3,"t":"3.3","q":"Terraform files live under infra/, modules/, and several service folders. They share conventions that should apply automatically whenever Claude edits a .tf file. What is the most maintainable setup?","o":["A rule file in .claude/rules/ with a paths glob such as **/*.tf","A CLAUDE.md file placed in every folder that contains Terraform files","A Terraform section in the root CLAUDE.md","A /terraform skill that developers run before editing"],"e":"Glob-based rules apply by file pattern regardless of directory, which suits conventions that span the codebase."},{"id":"3.3-02","d":3,"t":"3.3","q":"Besides applying the right conventions, what is the main benefit of putting conventions in path-scoped rules instead of the root CLAUDE.md?","o":["They load only when matching files are edited","They are enforced as hard errors that block the edit, unlike CLAUDE.md content, which is only advisory","They are private to each developer and not committed","They run before hooks and can block tool calls"],"e":"Path-scoped rules load conditionally, reducing irrelevant context and token usage. They are still guidance, not enforcement."},{"id":"3.3-03","d":3,"t":"3.3","q":"Which frontmatter makes a rule file in .claude/rules/ apply only to certain files?","o":["A paths field containing glob patterns","A context field set to fork","An allowed-tools field listing file names","A description field naming the directory"],"e":"Rule files use YAML frontmatter with a paths field of glob patterns for conditional activation."},{"id":"3.3-04","d":3,"t":"3.3","q":"A rule has paths: [\"terraform/*\"]. It applies when Claude edits terraform/main.tf but not terraform/modules/vpc/main.tf. What is the fix?","o":["Change the pattern to terraform/**/* so it matches nested files","Move the rule file into terraform/modules/vpc/","Add a second rule file with no frontmatter","Rename the rule file to match the nested file's name"],"e":"A single * matches one path segment. **/* matches files at any depth under the directory."},{"id":"3.3-05","d":3,"t":"3.3","q":"When is a directory-level CLAUDE.md a poor fit compared with a path-scoped rule?","o":["When the files sharing a convention are spread across many directories","When the convention applies to one self-contained directory and nothing outside it","When the convention is short","When the project has only one contributor"],"e":"Directory-level files are bound to their directory. Conventions for files scattered across the tree need glob patterns."},{"id":"3.4-01","d":3,"t":"3.4","q":"You're asked to replace a logging library used in 45 files, where the new library has a different initialization model. How should you start in Claude Code?","o":["Plan mode, to explore usage and design the migration first","Direct execution, fixing files one at a time as they come up","Direct execution with a very detailed up-front instruction that lists all 45 files","Direct execution first, switching to plan mode only if something breaks"],"e":"Large multi-file changes with architectural implications call for plan mode. The complexity is already known, so waiting for trouble is the wrong call."},{"id":"3.4-02","d":3,"t":"3.4","q":"A stack trace points to a null check missing on one line of one function. How should you proceed?","o":["Direct execution, since the change is small and well understood","Plan mode, since any bug fix deserves a written plan","Plan mode with the Explore subagent to map the codebase first","Fork the session so the fix can be compared against alternatives"],"e":"Simple, well-scoped changes with a clear fix suit direct execution. Plan mode would add overhead without benefit."},{"id":"3.4-03","d":3,"t":"3.4","q":"During a multi-phase task, the discovery phase reads hundreds of files and the main session starts running out of context before implementation begins. What helps?","o":["Delegate discovery to the Explore subagent, which returns a summary","Switch from plan mode to direct execution earlier","Raise the model's temperature so it reads less","Ask Claude to remember less of what it reads"],"e":"The Explore subagent isolates verbose discovery output and returns summaries, preserving the main conversation's context."},{"id":"3.4-04","d":3,"t":"3.4","q":"What is a sound way to combine plan mode and direct execution on a library migration?","o":["Plan mode to investigate and design, then direct execution","Use direct execution to investigate, then plan mode to implement","Alternate between the two modes on every file, to balance the speed of one with the safety of the other","Stay in plan mode for the entire task, including the edits"],"e":"Plan mode is for safe exploration and design. Once the approach is settled, direct execution carries it out."},{"id":"3.4-05","d":3,"t":"3.4","q":"A new integration could be built two ways: a message queue or direct API calls. They have different infrastructure requirements and trade-offs. Which mode fits the first step?","o":["Plan mode, because there are multiple valid approaches to evaluate","Direct execution, because integrations are routine","Direct execution on both approaches at once, in one session, to compare them","Neither; pick the approach with the fewest files"],"e":"Multiple valid approaches with different architectural consequences is one of the main reasons to use plan mode."},{"id":"3.5-01","d":3,"t":"3.5","q":"You've described a date-formatting transformation in prose three times and Claude interprets it differently each time. What is the most effective next step?","o":["Give two or three concrete input and output examples","Rewrite the prose description with more adjectives","Ask Claude to be more consistent","Switch to plan mode"],"e":"Concrete input/output examples are the most effective way to communicate a transformation when prose is being read inconsistently."},{"id":"3.5-02","d":3,"t":"3.5","q":"You want Claude to implement a parser with several tricky edge cases and to converge on a correct result efficiently. What workflow fits?","o":["Write a test suite first, then iterate by sharing the failing tests","Describe the edge cases in one long paragraph and accept the first result","Ask Claude to implement it and to tell you when it believes it is correct","Implement it yourself and ask Claude to review the style"],"e":"Test-driven iteration gives precise feedback. Sharing test failures guides each round of improvement toward expected behavior."},{"id":"3.5-03","d":3,"t":"3.5","q":"You're designing a caching layer in a domain you don't know well, and you're unsure which requirements matter. What technique surfaces considerations you may have missed?","o":["Have Claude ask you questions before it implements","Ask Claude to implement the most common caching pattern right away and adjust later","Provide three input and output examples of cache hits","Break the work into single-line edits"],"e":"The interview pattern has Claude ask questions first, surfacing things like invalidation strategy and failure modes before any code is written."},{"id":"3.5-04","d":3,"t":"3.5","q":"Claude's implementation has three problems. Fixing the first changes how the second and third should be fixed. How should you give the feedback?","o":["All three in one detailed message, since they interact","One at a time, waiting for each fix before sending the next","Only the most serious one, and hope the others resolve","As three separate sessions, one per problem"],"e":"Interacting issues go in a single message so the fixes are designed together. Independent issues are better fixed sequentially."},{"id":"3.5-05","d":3,"t":"3.5","q":"A migration script mishandles rows with null values. You've said \"handle nulls properly\" twice without improvement. What feedback is most likely to work?","o":["A specific test case showing a row with nulls and the exact expected output","The same instruction in capital letters","A request to rewrite the script from scratch","A link to general documentation on how null values should be handled in migrations"],"e":"Specific test cases with example input and expected output resolve edge-case handling far better than a general instruction."},{"id":"3.6-01","d":3,"t":"3.6","q":"A pipeline step runs claude \"Review this diff for bugs\" and the job hangs until it times out. Logs show Claude Code waiting for input. What fixes it?","o":["Add the -p flag so it runs non-interactively","Set an environment variable named CLAUDE_HEADLESS to true","Redirect standard input from /dev/null","Add a --batch flag to the command"],"e":"-p (or --print) runs Claude Code in non-interactive mode: it processes the prompt, prints the result, and exits."},{"id":"3.6-02","d":3,"t":"3.6","q":"A CI job needs to post Claude Code's review findings as inline pull request comments. A script must parse the output reliably. Which flags provide that?","o":["--output-format json together with --json-schema","--verbose together with --no-color","-p alone, with the script parsing the prose","--resume with the previous job's session"],"e":"--output-format json with --json-schema produces machine-parseable, schema-shaped findings that a script can post as inline comments."},{"id":"3.6-03","d":3,"t":"3.6","q":"Claude Code running in CI generates tests that ignore the team's fixtures and testing conventions. Where should that context be provided?","o":["In the project's CLAUDE.md, which CI-invoked Claude Code reads","In a comment block at the top of the CI workflow file that runs the job","In the pull request description","In the CI runner's home directory"],"e":"CLAUDE.md is the mechanism for giving project context, such as testing standards and available fixtures, to Claude Code in CI."},{"id":"3.6-04","d":3,"t":"3.6","q":"A team has Claude generate a feature and then, in the same session, review its own work before opening a pull request. Reviews rarely find anything, but human reviewers do. What change helps?","o":["Run the review in a separate, independent Claude instance","Ask the same session to review a second time","Tell the same session to be much more critical of its own work","Give the session a larger context window"],"e":"A session that wrote the code retains its reasoning and is less likely to question it. An independent instance without that context reviews more effectively."},{"id":"3.6-05","d":3,"t":"3.6","q":"A CI job asks Claude Code to suggest tests for each pull request. It keeps proposing scenarios the existing suite already covers. What addresses this?","o":["Include the existing test files in the context so it can see what is covered","Tell it to propose only \"novel\" tests","Limit it to three suggestions per run","Run it only on pull requests that add no tests"],"e":"Providing existing test files lets test generation avoid duplicating scenarios that are already covered."},{"id":"4.1-01","d":4,"t":"4.1","q":"An automated code reviewer produces many false positives. The team adds \"Be conservative and only flag real problems\" to the prompt. Nothing improves. Why?","o":["It doesn't say which issues to report and which to skip","The instruction needs to be placed at the very end of the prompt, where it carries more weight","The model ignores instructions that contain the word \"only\"","Conservative reviewing requires a lower temperature setting"],"e":"General instructions like \"be conservative\" don't improve precision. Explicit criteria naming what to report and what to skip do."},{"id":"4.1-02","d":4,"t":"4.1","q":"A reviewer flags nearly every code comment as \"possibly inaccurate\". Which instruction would be most effective?","o":["Flag a comment only when the behavior it claims contradicts what the code does","Check that all comments are accurate","Be careful when evaluating comments","Flag comments only if you are highly confident, after careful review, that they are wrong"],"e":"A specific, testable criterion gives the model something to apply. Vague or confidence-based wording leaves the judgment undefined."},{"id":"4.1-03","d":4,"t":"4.1","q":"In a review tool, the \"naming\" category is wrong about 70% of the time, while \"security\" is accurate. Developers have started ignoring all findings. What is the best immediate step?","o":["Turn off the naming category while its prompt is improved","Keep all categories on and ask developers to be patient","Lower the severity of every finding by one level","Add a note to each finding saying it might be wrong"],"e":"False positives in one category erode trust in the accurate ones. Temporarily disabling the noisy category restores trust while it is fixed."},{"id":"4.1-04","d":4,"t":"4.1","q":"The same kind of bug is rated \"critical\" in one review and \"minor\" in the next. What prompt change makes severity consistent?","o":["Define each severity level explicitly, with a concrete code example for each","Ask the model to double-check its severity rating before it returns each finding","Remove severity from the output entirely","Tell the model that severity is very important"],"e":"Explicit severity criteria with concrete examples for each level are what produce consistent classification."},{"id":"4.1-05","d":4,"t":"4.1","q":"A team changes its review prompt to \"Only report findings you are highly confident about.\" False positives barely move. What should the prompt say instead?","o":["Report bugs and security issues; skip style","Report findings you are at least 90% confident about","Report fewer findings than before","Report only the single most important finding in each file, and leave everything else out of the review"],"e":"Confidence-based filtering doesn't define what counts. Naming the categories to report and to skip does."},{"id":"4.2-01","d":4,"t":"4.2","q":"An agent with detailed written guidance still handles ambiguous requests inconsistently, such as choosing between two plausible tools. What technique is most effective?","o":["Two to four reasoned examples of ambiguous cases","A longer set of written rules that covers more situations and spells out which tool wins in each one","A single example of the most common, unambiguous case","An instruction to think carefully before choosing"],"e":"Few-shot examples of ambiguous cases, with the reasoning shown, let the model generalize judgment to situations the examples don't cover."},{"id":"4.2-02","d":4,"t":"4.2","q":"About how many few-shot examples does the guidance suggest for teaching an ambiguous judgment?","o":["Two to four well-chosen ones","Exactly one, to avoid confusing the model","At least twenty, to cover every case","None; examples reduce the model's flexibility"],"e":"A small number of targeted examples, two to four, aimed at the hard cases is the recommended range."},{"id":"4.2-03","d":4,"t":"4.2","q":"A review prompt has thorough instructions, but its findings come back in a different layout every time: sometimes a list, sometimes a paragraph, sometimes missing the suggested fix. What helps most?","o":["Few-shot examples that show the exact output layout: location, issue, severity, and fix","A sentence asking for consistent formatting","A longer explanation of why consistency matters","Running the prompt twice and keeping the better-looking output"],"e":"Few-shot examples demonstrating the desired output format are the most effective way to get consistently formatted results."},{"id":"4.2-04","d":4,"t":"4.2","q":"A reviewer flags a deliberate, common pattern in your codebase as a bug every time it appears. How can few-shot examples help?","o":["Show the acceptable pattern next to a real issue","Show ten examples of real bugs from other codebases so the model concentrates its attention on those","Show the pattern once with the note \"ignore this exact code\"","Remove all examples so the model relies on instructions"],"e":"Examples that contrast acceptable patterns with real issues reduce false positives while still letting the model generalize."},{"id":"4.2-05","d":4,"t":"4.2","q":"An extraction task returns inconsistent values for informal measurements such as \"a couple dozen\" or \"about half a liter\". Detailed instructions haven't fixed it. What is the best next step?","o":["Few-shot examples showing how informal measurements should be converted","A validation rule that rejects any non-numeric quantity","A larger model with more general knowledge","An instruction to skip any document that contains informal or approximate wording"],"e":"Few-shot examples of the specific hard case, here informal measurements, are what address extraction problems that instructions alone don't."},{"id":"4.3-01","d":4,"t":"4.3","q":"A pipeline asks Claude to \"respond with JSON only\" and occasionally gets output with a trailing comma or a stray sentence, breaking the parser. What is the most reliable fix?","o":["Define a tool whose input schema is the desired structure and extract it from the tool call","Add \"IMPORTANT: valid JSON only\" to the prompt","Write a regular expression that repairs common JSON mistakes","Ask for XML instead, since it is easier to parse"],"e":"Tool use with a JSON schema is the most reliable route to schema-compliant output. It eliminates JSON syntax errors."},{"id":"4.3-02","d":4,"t":"4.3","q":"An invoice extraction uses tool use with a strict JSON schema. Every output parses correctly, but in some the line items don't add up to the total. What does this show?","o":["Schemas prevent syntax errors but not semantic errors","The schema is missing a required field","Strict schemas are not actually enforced","The model should be told explicitly to output valid JSON"],"e":"A schema guarantees structure. Values in the wrong field or numbers that don't sum are semantic errors and need separate validation."},{"id":"4.3-03","d":4,"t":"4.3","q":"A contract schema requires a non-null renewal_date. Many contracts have no renewal clause, and the output contains dates that appear nowhere in the document. What schema change fixes this?","o":["Allow renewal_date to be null","Change renewal_date from a date to a free-text string","Add a second required field called renewal_date_confidence","Remove every other optional field so the model can focus"],"e":"When a source may not contain a field, making it nullable lets the model return null instead of fabricating a value to satisfy the schema."},{"id":"4.3-04","d":4,"t":"4.3","q":"A schema's document_category enum has eight values. Documents that fit none of them are being forced into the closest wrong category. What is the recommended schema pattern?","o":["Add an \"other\" value paired with a detail string field","Add fifty more enum values to cover more cases","Change the field to free text with no constraints","Reject any document that does not match one of the eight"],"e":"\"other\" plus a detail field keeps the enum extensible: unexpected categories are captured with their description instead of mislabeled."},{"id":"4.3-05","d":4,"t":"4.3","q":"A schema field classifies a clause as \"binding\" or \"non-binding\". Some clauses are too ambiguous to call, and the model picks one arbitrarily. What schema change is appropriate?","o":["Add an \"unclear\" value for ambiguous cases","Force a retry until the model is confident","Remove the field from the schema","Default every ambiguous clause to \"binding\""],"e":"An \"unclear\" enum value gives the model an honest option for ambiguous cases, which can then be routed to review."},{"id":"4.4-01","d":4,"t":"4.4","q":"A validation step finds a date in the wrong format in an extraction. What should the follow-up request to the model contain?","o":["The original document, the failed extraction, and the specific validation error","Only the message \"The extraction was invalid, try again\"","Only the original document, so the model starts fresh","Only the failed extraction, with the bad field removed"],"e":"Retry-with-error-feedback sends the document, the failed output, and the specific errors, so the model knows exactly what to correct."},{"id":"4.4-02","d":4,"t":"4.4","q":"Extractions of a supplier_license field fail validation after three retries for 6% of documents. In those documents, the license number is in a separate certificate that isn't provided. What should the pipeline do?","o":["Stop retrying those and route them for handling, since the information isn't in the source","Raise the retry limit to ten","Add few-shot examples of license numbers in several formats so the model recognizes them more often","Switch those documents to a larger model"],"e":"Retries fix format and structure mistakes. They can't produce information that is absent from the provided document."},{"id":"4.4-03","d":4,"t":"4.4","q":"Developers dismiss about a third of an automated reviewer's findings. You want to learn which kinds of code constructs trigger the dismissed ones. What should you add to the structured output?","o":["A detected_pattern field naming the construct that triggered each finding","A longer free-text explanation attached to each finding, describing the reasoning","A confidence score between 0 and 1","The name of the developer who wrote the code"],"e":"A detected_pattern field lets you group dismissals by the construct that triggered them and see which criteria need work."},{"id":"4.4-04","d":4,"t":"4.4","q":"You want the model to catch its own arithmetic problems when extracting invoices. What schema design supports this?","o":["Extract both a stated_total and a calculated_total, and flag when they differ","Extract a single total field and trust it","Ask for the total three times and take the most common value","Extract the total as text so no arithmetic is implied"],"e":"Having the model compute its own sum beside the printed one turns a hidden inconsistency into something code can check."},{"id":"4.4-05","d":4,"t":"4.4","q":"Which extraction failure is a validation retry most likely to fix?","o":["An amount returned as the string \"1,200 dollars\" where a number is required","A purchase order number that the document never mentions","A signature date that appears on a page which was not included in the upload","A tax ID stored in a separate system"],"e":"Format mismatches are fixable by retry because the information is present. The other three ask for data the source doesn't contain."},{"id":"4.5-01","d":4,"t":"4.5","q":"A team runs two jobs on the synchronous API: a pre-merge security check that blocks developers, and a nightly license audit read the next morning. They want to cut costs with the Message Batches API. What should they move?","o":["Only the nightly audit","Both jobs","Only the pre-merge check","Neither job"],"e":"Batch processing saves 50% but can take up to 24 hours with no latency guarantee. That suits overnight work and not a blocking check."},{"id":"4.5-02","d":4,"t":"4.5","q":"Results from a 5,000-request batch come back in a different order than they were submitted. How do you match each result to its original request?","o":["By the custom_id you assigned to each request","By the position of each result in the output","By the timestamp of each response","By re-sending each request and comparing outputs"],"e":"custom_id fields are how batch requests and responses are correlated."},{"id":"4.5-03","d":4,"t":"4.5","q":"An agentic workflow calls a tool, reads the result, then calls another tool, several times per document. Why is it a poor fit for a single batch request?","o":["The batch API doesn't support multi-turn tool calling within one request","The batch API rejects any request whose parameters include tool definitions","Batch requests are limited to 100 output tokens","Batch results are deleted before they can be read"],"e":"A batch request is a single turn. It can't execute a tool mid-request and return the result to the model."},{"id":"4.5-04","d":4,"t":"4.5","q":"In a 2,000-document batch, 40 documents fail because they exceed the context lim
